# Phase 2.3 — daily fixtures/results sync and odds capture (D-11).
# Phase 5.2 — the scanner runs as the second step, on the odds captured by the sync (D-15).
# GitHub cron is UTC and best effort (can be delayed or skipped under load).
# 08:17 UTC = 10:17 Bucharest in winter time (EET, from 25 Oct 2026), 11:17 in summer time (EEST).
name: daily-sync

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      scan_only:
        description: 'Skip the data sync (no odds credits); scan the odds already captured today'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev
      - name: Sync
        if: ${{ !inputs.scan_only }}
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/daily-sync.js
      - name: Scan
        # Runs even if one competition failed to sync; a partial sync still gives a useful scan.
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
        run: node scripts/scan.js
      - name: Settle
        # Phase 5.4: paper settlement of predictions whose fixtures have finished (results come from Sync).
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/settle.js
