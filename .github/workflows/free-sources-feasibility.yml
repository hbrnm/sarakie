# FVIS Phase 2b — free-source combination feasibility probe (manual, measurement only).
name: free-sources-feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run probe
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node spike/free-sources-feasibility.js
          cat spike-output/summary-2b.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: free-sources-feasibility-${{ github.run_id }}
          path: spike-output/
          retention-days: 30
          if-no-files-found: ignore
