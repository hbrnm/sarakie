# Render Blueprint — FVIS Telegram bot (Phase 1). Free plan: sleeps after ~15 min idle.
# Secrets are NOT stored here: values marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: fvis-bot
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
